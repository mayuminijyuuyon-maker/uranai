<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今のわたし、星的にはどう？</title>
</head>
<body>
<div id="astro-now-app">
<style>
#astro-now-app{--ink:#293241;--navy:#394867;--lav:#f5f2fb;--gold:#f4c95d;--green:#3a9d78;--red:#d95d65;--amber:#e3a72f;max-width:760px;margin:auto;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;line-height:1.65}
#astro-now-app *{box-sizing:border-box}.an-hero{padding:24px 18px;border-radius:18px;background:linear-gradient(135deg,#394867,#596a92);color:#fff}.an-hero h1{font-size:clamp(24px,7vw,38px);line-height:1.25;margin:0 0 6px}.an-hero p{margin:0;opacity:.9}
.an-box{margin-top:16px;padding:16px;background:#fff;border:1px solid #e5e8ef;border-radius:16px;box-shadow:0 5px 18px #27324a12}.an-title{font-weight:800;color:var(--navy);margin:0 0 12px}.an-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.an-field label{display:block;font-size:12px;font-weight:700;margin-bottom:4px}
.an-field input,.an-field select{width:100%;min-height:44px;border:1px solid #cbd2df;border-radius:10px;padding:8px 10px;background:#fff;font-size:16px}.an-btn{width:100%;min-height:48px;margin-top:14px;border:0;border-radius:12px;background:var(--gold);color:#253047;font-size:16px;font-weight:800;cursor:pointer}
.an-main{border-left:6px solid var(--amber);background:#fffaf0}.an-main pre,.an-reading{white-space:pre-wrap;font:inherit;margin:0}.an-cards{display:grid;gap:12px}.an-card{padding:15px;border-radius:14px;background:var(--lav);border:1px solid #e5dff0}.an-card-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.an-rank{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;font-weight:800}.an-card h3{font-size:17px;margin:0;flex:1}.an-badge{padding:3px 9px;border-radius:999px;color:#fff;font-size:12px;font-weight:800}.an-badge.追い風{background:var(--green)}.an-badge.変化の時{background:var(--amber)}.an-badge.要調整{background:var(--red)}
.an-meta{font-size:13px;color:#687386;margin:7px 0}.an-sky{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.an-sky div{padding:10px;border-radius:10px;background:#f5f7fa}.an-note{font-size:12px;color:#687386}.an-empty{padding:18px;text-align:center;background:#f5f7fa;border-radius:12px}
@media(max-width:520px){.an-grid{grid-template-columns:1fr}.an-sky{grid-template-columns:1fr}.an-box{padding:14px}.an-hero{border-radius:0}}
</style>

<section class="an-hero">
<div style="font-size:12px;opacity:.8">動作確認版 v6</div>
<h1>今のわたし、星的にはどう？</h1>
<p>追い風・変化・見直しポイントと、今の過ごし方</p>
</section>

<section class="an-box">
<h2 class="an-title">分析設定</h2>
<div class="an-grid">
<div class="an-field"><label for="an-date">分析日（現在の日付）</label><input id="an-date" type="date"></div>
<div class="an-field"><label for="an-birth">生年月日</label><input id="an-birth" type="date"></div>
<div class="an-field"><label for="an-time">出生時刻（任意）</label><input id="an-time" type="time" value="12:00"></div>
<div class="an-field"><label for="an-place">出生都道府県</label>
<select id="an-place">
<option>北海道</option><option>青森県</option><option>岩手県</option><option>宮城県</option><option>秋田県</option><option>山形県</option><option>福島県</option>
<option>茨城県</option><option>栃木県</option><option>群馬県</option><option>埼玉県</option><option>千葉県</option><option>東京都</option><option>神奈川県</option>
<option>新潟県</option><option>富山県</option><option>石川県</option><option>福井県</option><option>山梨県</option><option>長野県</option><option>岐阜県</option>
<option>静岡県</option><option selected>愛知県</option><option>三重県</option><option>滋賀県</option><option>京都府</option><option>大阪府</option><option>兵庫県</option>
<option>奈良県</option><option>和歌山県</option><option>鳥取県</option><option>島根県</option><option>岡山県</option><option>広島県</option><option>山口県</option>
<option>徳島県</option><option>香川県</option><option>愛媛県</option><option>高知県</option><option>福岡県</option><option>佐賀県</option><option>長崎県</option>
<option>熊本県</option><option>大分県</option><option>宮崎県</option><option>鹿児島県</option><option>沖縄県</option>
</select></div>
</div>
<button class="an-btn" id="an-run" type="button">この内容で占う</button>
<div id="an-status" class="an-note" role="status" style="margin-top:8px"></div>
<div id="an-error" style="display:none;margin-top:10px;padding:10px;border-radius:10px;background:#ffe2e2;color:#8a1f2d;font-weight:bold"></div>
</section>

<section class="an-box an-main"><h2 class="an-title">今の最重要テーマ｜4つのポイント</h2><pre id="an-top">結果を計算しています…</pre></section>
<section class="an-box"><h2 class="an-title">今、影響が強いこと（最大6件）</h2><div class="an-cards" id="an-cards"><div class="an-empty">結果を計算しています…</div></div></section>
<section class="an-box"><h2 class="an-title">参考｜今の空の動き</h2><div class="an-sky" id="an-sky"></div><p class="an-note">🟢 追い風：自然に進めやすい　🟡 変化の時：新しい動きが起きやすい　🔴 要調整：焦らず見直しが必要</p></section>
<section class="an-box an-note">天体位置は低精度の近似式を使用しています。厳密な時期判断には高精度占星術ソフトとの照合をおすすめします。</section>

<script>
(function(){
"use strict";

var $=function(id){return document.getElementById(id);};
var R=Math.PI/180, D=180/Math.PI;

function mod(n){return ((n%360)+360)%360;}

function daysFromJ2000(date,time){
  var p=date.split("-");
  var t=(time||"12:00").split(":");
  var ms=Date.UTC(Number(p[0]),Number(p[1])-1,Number(p[2]),Number(t[0])||0,Number(t[1])||0);
  return ms/86400000-10957.5;
}

/*
 * ここでは「天体計算」と「表示」を完全に分けています。
 * 以前のコードで計算途中に止まっていた場合でも、
 * どこで止まったかを画面に表示できます。
 */
function getPlanets(d){
  var earth={};

  // 太陽・地球
  var M=mod(356.047+0.9856002585*d);
  var e=0.016709-0.000000001151*d;
  var E=M*R+e*Math.sin(M*R)*(1+e*Math.cos(M*R));
  var x=Math.cos(E)-e;
  var y=Math.sqrt(1-e*e)*Math.sin(E);
  var v=Math.atan2(y,x)*D;
  var dist=Math.sqrt(x*x+y*y);
  var sun=mod(v+282.9404+0.0000470935*d);
  earth.x=dist*Math.cos(sun*R);
  earth.y=dist*Math.sin(sun*R);

  var out={太陽:sun,_earth:earth};

  var data={
    水星:[48.3313,0.0000324587,7.0047,0.00000005,29.1241,0.0000101444,0.387098,0,0.205635,-0.000000000559,168.6562,4.0923344368],
    金星:[76.6799,0.000024659,3.3946,0.0000000275,54.891,0.0000138374,0.72333,0,0.006773,-0.000000001302,48.0052,1.6021302244],
    火星:[49.5574,0.0000211081,1.8497,-0.0000000178,286.5016,0.0000292961,1.523688,0,0.093405,0.000000002516,18.6021,0.5240207766],
    木星:[100.4542,0.0000276854,1.303,-0.0000001557,273.8777,0.0000164505,5.20256,0,0.048498,0.000000004469,19.895,0.0830853001],
    土星:[113.6634,0.000023898,2.4886,-0.0000001081,339.3939,0.0000297661,9.55475,0,0.055546,-0.000000009499,316.967,0.0334442282],
    天王星:[74.0005,0.000013978,0.7733,0.000000019,96.6612,0.000030565,19.18171,-0.0000000155,0.047318,0.00000000745,142.5905,0.011725806],
    海王星:[131.7806,0.000030173,1.77,-0.000000255,272.8461,-0.000006027,30.05826,0.00000003313,0.008606,0.00000000215,260.2471,0.005995147]
  };

  Object.keys(data).forEach(function(k){
    var a=data[k];
    var N=(a[0]+a[1]*d)*R;
    var inc=(a[2]+a[3]*d)*R;
    var w=(a[4]+a[5]*d)*R;
    var sm=a[6]+a[7]*d;
    var ec=a[8]+a[9]*d;
    var ma=(a[10]+a[11]*d)*R;
    var en=ma+ec*Math.sin(ma)*(1+ec*Math.cos(ma));
    var xx=sm*(Math.cos(en)-ec);
    var yy=sm*Math.sqrt(1-ec*ec)*Math.sin(en);
    var tv=Math.atan2(yy,xx)*D;
    var rr=Math.sqrt(xx*xx+yy*yy);
    var X=rr*(Math.cos(N)*Math.cos((tv*R)+w)-Math.sin(N)*Math.sin((tv*R)+w)*Math.cos(inc));
    var Y=rr*(Math.sin(N)*Math.cos((tv*R)+w)+Math.cos(N)*Math.sin((tv*R)+w)*Math.cos(inc));
    out[k]=mod(Math.atan2(Y+earth.y,X+earth.x)*D);
  });

  // 月の簡易位置
  var mm=mod(115.3654+13.0649929509*d);
  var node=mod(125.1228-0.0529538083*d);
  var moon=mod(mm+node+318.0634+0.1643573223*d);
  out.月=moon;

  // 冥王星：長期変化を見るための簡易位置
  out.冥王星=mod(238.95+0.003968789*d);

  return out;
}

var aspects=[
  {a:0,n:"強く重なる",s:"変化の時"},
  {a:60,n:"協力しやすい",s:"追い風"},
  {a:90,n:"ぶつかって見直す",s:"要調整"},
  {a:120,n:"自然に活かせる",s:"追い風"},
  {a:180,n:"向き合って調整する",s:"要調整"}
];

var current=["太陽","火星","木星","土星","天王星","海王星","冥王星"];
var natal=["太陽","月","水星","金星","火星"];
var force={太陽:"関心・意識",火星:"行動力",木星:"成長・広がり",土星:"責任・見直し",天王星:"変化・自由",海王星:"理想・直感",冥王星:"根本的な変化"};
var theme={太陽:"自分らしさ",月:"心の安心",水星:"考え方・伝え方",金星:"恋愛・人間関係",火星:"行動・自己主張"};
var duration={太陽:"約1週間",火星:"約2～3週間",木星:"約1～2か月",土星:"約2～4か月",天王星:"約3～6か月",海王星:"約3～6か月",冥王星:"約4～8か月"};
var pBonus={太陽:2,火星:3,木星:8,土星:9,天王星:7,海王星:6,冥王星:10};
var nBonus={太陽:5,月:4,水星:2,金星:3,火星:3};
var zodiac=["牡羊座♈","牡牛座♉","双子座♊","蟹座♋","獅子座♌","乙女座♍","天秤座♎","蠍座♏","射手座♐","山羊座♑","水瓶座♒","魚座♓"];

var events={
太陽:{追い風:"自分の方向性が見えやすく、やりたかったことを進めやすくなります。",変化の時:"今までの目標や役割を変えたくなり、新しい方向へ動きたくなります。",要調整:"周囲の期待と自分の希望が合わず、進む方向に迷いやすくなります。"},
月:{追い風:"気持ちが安定しやすく、安心できる人や環境を選びやすくなります。",変化の時:"気分や生活リズムが変わりやすく、心地よい居場所を作り直したくなります。",要調整:"感情が揺れやすく、疲れや不安を抱え込みやすくなります。"},
水星:{追い風:"考えがまとまりやすく、相談・説明・連絡がスムーズに進みます。",変化の時:"新しい考えが次々に浮かび、伝え方や学び方を変えたくなります。",要調整:"考えが散らかりやすく、誤解や確認不足が起こりやすくなります。"},
金星:{追い風:"人との関係を心地よく進めやすく、本音や好みも伝えやすくなります。",変化の時:"人間関係や好きなものが変わりやすく、新しい出会いや価値観に惹かれます。",要調整:"相手との温度差や、お金・価値観の違いが気になりやすくなります。"},
火星:{追い風:"行動力が高まり、自分の意見を出して物事を前へ進めやすくなります。",変化の時:"急にやる気が高まり、今までと違う方法を試したくなります。",要調整:"焦りや苛立ちが出やすく、言い過ぎや無理な行動につながりやすくなります。"}
};

var action={
追い風:["今いちばん進めたいことを一つ選び、具体的な一歩を今日中に始めましょう。","調子がよくても予定を詰め込みすぎず、大切な確認は省かないようにしましょう。"],
変化の時:["変えたいことを一つ書き出し、小さく試してから本格的に切り替えましょう。","勢いだけで全部を変えず、続けたいものと手放すものを分けましょう。"],
要調整:["違和感の原因を整理し、急いで結論を出さずに一つずつ整えましょう。","疲れているときの決断や感情的な返事を避け、事実を確認しましょう。"]
};

function reading(t,s){
  return "【今の状態】"+theme[t]+"は「"+s+"」です。\n【起こりやすいこと】"+events[t][s]+"\n【やること】"+action[s][0]+"\n【注意点】"+action[s][1];
}

function showError(e){
  $("an-error").style.display="block";
  $("an-error").textContent="計算エラー："+(e&&e.message?e.message:String(e));
  $("an-status").textContent="計算に失敗しました。";
}

function analyze(){
  $("an-error").style.display="none";
  $("an-status").textContent="計算中…";

  try{
    var ad=$("an-date").value;
    var bd=$("an-birth").value;
    var bt=$("an-time").value||"12:00";

    if(!ad||!bd){
      $("an-status").textContent="分析日と生年月日を入力してください。";
      return;
    }

    var cp=getPlanets(daysFromJ2000(ad,"12:00"));
    var np=getPlanets(daysFromJ2000(bd,bt));
    var hits=[];

    current.forEach(function(c){
      natal.forEach(function(n){
        var dif=Math.abs(cp[c]-np[n]);
        dif=Math.min(dif,360-dif);
        var best=aspects[0];

        aspects.forEach(function(a){
          if(Math.abs(dif-a.a)<Math.abs(dif-best.a))best=a;
        });

        var orb=Math.abs(dif-best.a);
        var limit=(c==="太陽"||c==="火星")?5:4;

        if(orb<=limit){
          hits.push({c:c,n:n,asp:best,orb:orb,score:100-orb*10+pBonus[c]+nBonus[n]});
        }
      });
    });

    hits.sort(function(a,b){return b.score-a.score;});
    var top=hits.slice(0,6);

    if(top.length){
      $("an-top").textContent=reading(top[0].n,top[0].asp.s);
      $("an-cards").innerHTML=top.map(function(x,i){
        return '<article class="an-card"><div class="an-card-head"><span class="an-rank">'+(i+1)+'</span><h3>'+force[x.c]+' × '+theme[x.n]+'</h3><span class="an-badge '+x.asp.s+'">'+x.asp.s+'</span></div><div class="an-meta">'+x.asp.n+'｜'+duration[x.c]+'｜誤差 '+x.orb.toFixed(1)+'°</div><div class="an-reading">'+reading(x.n,x.asp.s)+'</div></article>';
      }).join("");
    }else{
      $("an-top").textContent="【今の状態】大きな変化が少ない時期です。\n【起こりやすいこと】普段どおりのペースで過ごしやすいでしょう。\n【やること】後回しにしていた小さな用事を一つ終わらせましょう。\n【注意点】変化がないことを焦らず、生活の土台を整えましょう。";
      $("an-cards").innerHTML='<div class="an-empty">今は大きな変化が少ない時期です。生活の土台を整えましょう。</div>';
    }

    $("an-sky").innerHTML=current.map(function(x){
      return "<div><strong>"+x+"</strong><br>"+zodiac[Math.floor(mod(cp[x])/30)]+"</div>";
    }).join("");

    $("an-status").textContent="占い結果を更新しました。";
  }catch(e){
    showError(e);
  }
}

// 初期値
(function init(){
  var d=new Date();
  var pad=function(n){return String(n).padStart(2,"0");};
  $("an-date").value=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  $("an-birth").value="1984-12-24";
  $("an-time").value="12:00";

  $("an-run").addEventListener("click",analyze);
  $("an-date").addEventListener("change",analyze);
  $("an-birth").addEventListener("change",analyze);
  $("an-time").addEventListener("change",analyze);

  analyze();
})();
})();
</script>
