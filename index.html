<script>
(function(){
"use strict";

var $=function(id){return document.getElementById(id);};
var R=Math.PI/180, D=180/Math.PI;

function mod(n){return ((n%360)+360)%360;}

function daysFromJ2000(date,time){
  var p=date.split("-");
  var t=(time||"12:00").split(":");
  var ms=Date.UTC(Number(p[0]),Number(p[1])-1,Number(p[2]),Number(t[0])||0,Number(t[1])||0);
  return ms/86400000-10957.5;
}

/*
 * ここでは「天体計算」と「表示」を完全に分けています。
 * 以前のコードで計算途中に止まっていた場合でも、
 * どこで止まったかを画面に表示できます。
 */
function getPlanets(d){
  var earth={};

  // 太陽・地球
  var M=mod(356.047+0.9856002585*d);
  var e=0.016709-0.000000001151*d;
  var E=M*R+e*Math.sin(M*R)*(1+e*Math.cos(M*R));
  var x=Math.cos(E)-e;
  var y=Math.sqrt(1-e*e)*Math.sin(E);
  var v=Math.atan2(y,x)*D;
  var dist=Math.sqrt(x*x+y*y);
  var sun=mod(v+282.9404+0.0000470935*d);
  earth.x=dist*Math.cos(sun*R);
  earth.y=dist*Math.sin(sun*R);

  var out={太陽:sun,_earth:earth};

  var data={
    水星:[48.3313,0.0000324587,7.0047,0.00000005,29.1241,0.0000101444,0.387098,0,0.205635,-0.000000000559,168.6562,4.0923344368],
    金星:[76.6799,0.000024659,3.3946,0.0000000275,54.891,0.0000138374,0.72333,0,0.006773,-0.000000001302,48.0052,1.6021302244],
    火星:[49.5574,0.0000211081,1.8497,-0.0000000178,286.5016,0.0000292961,1.523688,0,0.093405,0.000000002516,18.6021,0.5240207766],
    木星:[100.4542,0.0000276854,1.303,-0.0000001557,273.8777,0.0000164505,5.20256,0,0.048498,0.000000004469,19.895,0.0830853001],
    土星:[113.6634,0.000023898,2.4886,-0.0000001081,339.3939,0.0000297661,9.55475,0,0.055546,-0.000000009499,316.967,0.0334442282],
    天王星:[74.0005,0.000013978,0.7733,0.000000019,96.6612,0.000030565,19.18171,-0.0000000155,0.047318,0.00000000745,142.5905,0.011725806],
    海王星:[131.7806,0.000030173,1.77,-0.000000255,272.8461,-0.000006027,30.05826,0.00000003313,0.008606,0.00000000215,260.2471,0.005995147]
  };

  Object.keys(data).forEach(function(k){
    var a=data[k];
    var N=(a[0]+a[1]*d)*R;
    var inc=(a[2]+a[3]*d)*R;
    var w=(a[4]+a[5]*d)*R;
    var sm=a[6]+a[7]*d;
    var ec=a[8]+a[9]*d;
    var ma=(a[10]+a[11]*d)*R;
    var en=ma+ec*Math.sin(ma)*(1+ec*Math.cos(ma));
    var xx=sm*(Math.cos(en)-ec);
    var yy=sm*Math.sqrt(1-ec*ec)*Math.sin(en);
    var tv=Math.atan2(yy,xx)*D;
    var rr=Math.sqrt(xx*xx+yy*yy);
    var X=rr*(Math.cos(N)*Math.cos((tv*R)+w)-Math.sin(N)*Math.sin((tv*R)+w)*Math.cos(inc));
    var Y=rr*(Math.sin(N)*Math.cos((tv*R)+w)+Math.cos(N)*Math.sin((tv*R)+w)*Math.cos(inc));
    out[k]=mod(Math.atan2(Y+earth.y,X+earth.x)*D);
  });

  // 月の簡易位置
  var mm=mod(115.3654+13.0649929509*d);
  var node=mod(125.1228-0.0529538083*d);
  var moon=mod(mm+node+318.0634+0.1643573223*d);
  out.月=moon;

  // 冥王星：長期変化を見るための簡易位置
  out.冥王星=mod(238.95+0.003968789*d);

  return out;
}

var aspects=[

var current=["太陽","火星","木星","土星","天王星","海王星","冥王星"];

var force={太陽:"関心・意識",火星:"行動力",木星:"成長・広がり",土星:"責任・見直し",天王星:"変化・自由",海王星:"理想・直感",冥王星:"根本的な変化"};

var pBonus={太陽:2,火星:3,木星:8,土星:9,天王星:7,海王星:6,冥王星:10};
var nBonus={太陽:5,月:4,水星:2,金星:3,火星:3};

var events={
太陽:{追い風:"自分の方向性が見えやすく、やりたかったことを進めやすくなります。",変化の時:"今までの目標や役割を変えたくなり、新しい方向へ動きたくなります。",要調整:"周囲の期待と自分の希望が合わず、進む方向に迷いやすくなります。"},
月:{追い風:"気持ちが安定しやすく、安心できる人や環境を選びやすくなります。",変化の時:"気分や生活リズムが変わりやすく、心地よい居場所を作り直したくなります。",要調整:"感情が揺れやすく、疲れや不安を抱え込みやすくなります。"},
水星:{追い風:"考えがまとまりやすく、相談・説明・連絡がスムーズに進みます。",変化の時:"新しい考えが次々に浮かび、伝え方や学び方を変えたくなります。",要調整:"考えが散らかりやすく、誤解や確認不足が起こりやすくなります。"},
金星:{追い風:"人との関係を心地よく進めやすく、本音や好みも伝えやすくなります。",変化の時:"人間関係や好きなものが変わりやすく、新しい出会いや価値観に惹かれます。",要調整:"相手との温度差や、お金・価値観の違いが気になりやすくなります。"},
火星:{追い風:"行動力が高まり、自分の意見を出して物事を前へ進めやすくなります。",変化の時:"急にやる気が高まり、今までと違う方法を試したくなります。",要調整:"焦りや苛立ちが出やすく、言い過ぎや無理な行動につながりやすくなります。"}
};

var action={
追い風:["今いちばん進めたいことを一つ選び、具体的な一歩を今日中に始めましょう。","調子がよくても予定を詰め込みすぎず、大切な確認は省かないようにしましょう。"],
変化の時:["変えたいことを一つ書き出し、小さく試してから本格的に切り替えましょう。","勢いだけで全部を変えず、続けたいものと手放すものを分けましょう。"],
要調整:["違和感の原因を整理し、急いで結論を出さずに一つずつ整えましょう。","疲れているときの決断や感情的な返事を避け、事実を確認しましょう。"]
};

}

function personalityText(planet, sign){
  var t={
    太陽:{
      牡羊座:"自分で決めたらまず動く、率直で行動の早いタイプ。",
      牡牛座:"自分のペースと安心感を大切にし、納得したことをじっくり育てるタイプ。",
      双子座:"好奇心が強く、情報を集めながら柔軟に考えるタイプ。",

      獅子座:"自分らしさを堂々と表現し、好きなことに誇りを持つタイプ。",

      山羊座:"自分の役割を果たせている感覚が安心感につながる傾向。",
      水瓶座:"一人の時間や自分だけの考えを持てる余白を必要とする傾向。",
      魚座:"周囲の感情を受け取りやすく、静かな時間で回復しやすい傾向。"
    }
  };
  return (t[planet]&&t[planet][sign])||"";
}

function signName(deg){
  var z=["牡羊座","牡牛座","双子座","蟹座","獅子座","乙女座","天秤座","蠍座","射手座","山羊座","水瓶座","魚座"];
  return z[Math.floor(mod(deg)/30)];
}

function analyze(){
  $("an-error").style.display="none";
  $("an-status").textContent="計算中…";

  try{
    var ad=$("an-date").value;
    var bd=$("an-birth").value;
    var bt=$("an-time").value||"12:00";

    if(!ad||!bd){
      $("an-status").textContent="分析日と生年月日を入力してください。";
      return;
    }

    var cp=getPlanets(daysFromJ2000(ad,"12:00"));
    var np=getPlanets(daysFromJ2000(bd,bt));
    var hits=[];

    current.forEach(function(c){
      natal.forEach(function(n){
        var dif=Math.abs(cp[c]-np[n]);
        dif=Math.min(dif,360-dif);
        var best=aspects[0];

        aspects.forEach(function(a){
          if(Math.abs(dif-a.a)<Math.abs(dif-best.a))best=a;
        });

        var orb=Math.abs(dif-best.a);
        var limit=(c==="太陽"||c==="火星")?5:4;

        if(orb<=limit){
          hits.push({c:c,n:n,asp:best,orb:orb,score:100-orb*10+pBonus[c]+nBonus[n]});
        }
      });
    });

    hits.sort(function(a,b){return b.score-a.score;});
    var top=hits.slice(0,6);
      showPersonality(np,top);

    if(top.length){
      $("an-top").textContent=reading(top[0].n,top[0].asp.s);
      $("an-cards").innerHTML=top.map(function(x,i){
        return '<article class="an-card"><div class="an-card-head"><span class="an-rank">'+(i+1)+'</span><h3>'+force[x.c]+' × '+theme[x.n]+'</h3><span class="an-badge '+x.asp.s+'">'+x.asp.s+'</span></div><div class="an-meta">'+x.asp.n+'｜'+duration[x.c]+'｜誤差 '+x.orb.toFixed(1)+'°</div><div class="an-reading">'+reading(x.n,x.asp.s)+'</div></article>';
      }).join("");
    }else{
      $("an-top").textContent="【今の状態】大きな変化が少ない時期です。\n【起こりやすいこと】普段どおりのペースで過ごしやすいでしょう。\n【やること】後回しにしていた小さな用事を一つ終わらせましょう。\n【注意点】変化がないことを焦らず、生活の土台を整えましょう。";
      $("an-cards").innerHTML='<div class="an-empty">今は大きな変化が少ない時期です。生活の土台を整えましょう。</div>';
    }

    $("an-sky").innerHTML=current.map(function(x){
      return "<div><strong>"+x+"</strong><br>"+zodiac[Math.floor(mod(cp[x])/30)]+"</div>";
    }).join("");

    $("an-status").textContent="占い結果を更新しました。";
  }catch(e){
    showError(e);
  }
}

// 初期値
(function init(){
  var d=new Date();
  var pad=function(n){return String(n).padStart(2,"0");};
  $("an-date").value=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  $("an-birth").value="1984-12-24";
  $("an-time").value="12:00";

  $("an-run").addEventListener("click",analyze);
  $("an-date").addEventListener("change",analyze);
  $("an-birth").addEventListener("change",analyze);
  $("an-time").addEventListener("change",analyze);

  analyze();
})();
})();
</script>
