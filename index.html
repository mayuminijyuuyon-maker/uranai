var force={太陽:'意識が向く',火星:'行動する力',木星:'チャンス・成長',土星:'見直し・土台づくり',天王星:'変化・自由',海王星:'想像力・感じ取る力',冥王星:'大きな変化・立て直し'},theme={太陽:'自分らしさ',月:'心の安心',水星:'考え方・伝え方',金星:'恋愛・人間関係',火星:'行動・自己主張'},duration={太陽:'約1週間',火星:'約2～3週間',木星:'約1～2か月',土星:'約2～4か月',天王星:'約3～6か月',海王星:'約3～6か月',冥王星:'約4～8か月'},current=['太陽','火星','木星','土星','天王星','海王星','冥王星'],natal=['太陽','月','水星','金星','火星'],aspects=[{a:0,s:'変化の時'},{a:60,s:'追い風'},{a:90,s:'要調整'},{a:120,s:'追い風'},{a:180,s:'要調整'}];var ps={太陽:['決めたらすぐ動ける人です。','自分のペースを大切にする人です。','好奇心が強く、話しながら考える人です。','身近な人と安心できる場所を大切にします。','好きなことを堂々と表現する人です。','細かいところに気づき、整えて動く人です。','相手とのバランスを大切にする人です。','表面だけで判断せず、深く向き合う人です。','自由に学び、新しい世界へ進む人です。','目標へコツコツ進む責任感の強い人です。','人と違う考えを大切にする人です。','共感力が強く、雰囲気も感じ取る人です。'],月:['気持ちの切り替えが早いタイプです。','安定した生活があると落ち着きます。','話したり調べたりすると気分転換できます。','信頼できる人や居場所が心の支えです。','好きなことを楽しむと元気になります。','身の回りが整うと安心します。','穏やかで公平な関係があると安心します。','気持ちを簡単には見せず、深い信頼を求めます。','自由に動くと気分が晴れます。','予定が見え、やることが片づくと安心します。','一人で考える時間が必要です。','周りの気持ちに影響されやすく、静かな休息が必要です。']};
function eventText(t,s){var good={太陽:'自分の考えを素直に出しやすくなります。',月:'気持ちが落ち着きやすくなります。',水星:'考えがまとまり、伝わりやすくなります。',金星:'人との距離が縮まり、本音を伝えやすくなります。',火星:'迷いが減り、動き出しやすくなります。'},change={太陽:'新しい自分を試したくなります。',月:'安心できる過ごし方が変わりそうです。',水星:'考え方や話し方に変化が起こりそうです。',金星:'人間関係や好きなものが変わりそうです。',火星:'違う動き方を試したくなります。'},adjust={太陽:'周りの期待と自分の希望がずれやすくなります。',月:'気持ちが落ち着きにくくなります。',水星:'言葉の行き違いが起きやすくなります。',金星:'相手との温度差が気になりやすくなります。',火星:'焦りやイライラが出やすくなります。'};return s==='追い風'?good[t]:s==='変化の時'?change[t]:adjust[t]}function reading(t,s){var doit=s==='追い風'?'今日できる小さな一歩を始めましょう。':s==='変化の時'?'変えたいことを一つだけ、小さく試しましょう。':'すぐに結論を出さず、一つずつ確認しましょう。';return '【ひとことで】'+theme[t]+'は「'+s+'」です。<br>【起こりそうなこと】'+eventText(t,s)+'<br>【今やるといいこと】'+doit+'<br>【気をつけること】疲れているときの大きな決断は避けましょう。'}
function runTorisetsu(){var err=el('error');err.style.display='none';try{el('status').innerHTML='計算中…';var cp=planets(dval(el('date').value,'12:00')),np=planets(dval(dateString(),el('bt').value||'00:00')),hits=[],c,n,dif,j,best,orb,limit;for(c=0;c<current.length;c++)for(n=0;n<natal.length;n++){dif=Math.abs(cp[current[c]]-np[natal[n]]);dif=Math.min(dif,360-dif);best=aspects[0];for(j=1;j<aspects.length;j++)if(Math.abs(dif-aspects[j].a)<Math.abs(dif-best.a))best=aspects[j];orb=Math.abs(dif-best.a);limit=(current[c]==='太陽'||current[c]==='火星')?5:4;if(orb<=limit)hits.push({c:current[c],n:natal[n],s:best.s,orb:orb,score:100-orb*10})}hits.sort(function(a,b){return b.score-a.score});hits=hits.slice(0,3);var si=Math.floor(mod(np.太陽)/30),mi=Math.floor(mod(np.月)/30);el('natal').innerHTML='<div class=""profile""><strong>表に出る私（太陽）｜'+signs[si]+'</strong><br>'+ps.太陽[si]+'</div><div class=""profile""><strong>心の中の私（月）｜'+signs[mi]+'</strong><br>'+ps.月[mi]+'</div>';var x=hits[0];if(x){el('current').innerHTML='<div class=""profile""><strong>'+force[x.c]+' × '+theme[x.n]+'｜'+x.s+'</strong><br>'+eventText(x.n,x.s)+'</div>';el('top').innerHTML=reading(x.n,x.s);el('tips').innerHTML='<div class=""tip""><strong>① 大切にすること</strong><br>「'+theme[x.n]+'」を優先しましょう。</div><div class=""tip""><strong>② 動き方</strong><br>急いで決めず、小さく進めましょう。</div><div class=""tip""><strong>③ 休み方</strong><br>休む時間を確保しましょう。</div>';var cards='';for(j=0;j<hits.length;j++){x=hits[j];cards+='<div class=""card""><span class=""badge '+(x.s==='追い風'?'green':x.s==='変化の時'?'amber':'red')+'"">'+x.s+'</span><strong>'+(j+1)+'. '+force[x.c]+' × '+theme[x.n]+'</strong><div class=""note"">'+duration[x.c]+'</div><div class=""reading"">'+reading(x.n,x.s)+'</div></div>'}el('cards').innerHTML=cards}var p=['太陽','月','水星','金星','火星','木星','土星','天王星','海王星','冥王星'],sky='';for(j=0;j<p.length;j++)sky+='<div><strong>'+p[j]+'</strong><br>'+signs[Math.floor(mod(np[p[j]])/30)]+'</div>';el('birthSky').innerHTML=sky;el('status').innerHTML='結果を表示しました。'}catch(e){el('status').innerHTML='';err.style.display='block';err.innerHTML='計算できませんでした：'+e.message}}
function initTorisetsu(){var now=new Date(),today=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());el('date').value=today;el('by').value='1984';el('bm').value='12';el('bd').value='24';el('by').onchange=days;el('bm').onchange=days;runTorisetsu()}
initTorisetsu();
</script></body></html>"
